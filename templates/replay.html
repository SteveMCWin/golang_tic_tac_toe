<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Tic-Tac-Toe Replay</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/replay.css">
</head>
<body>
    <div class="replay-container">
        <div class="replay-header">
            <h1 class="replay-title">Game Replay</h1>
            <p class="replay-subtitle">Review your game moves</p>
        </div>
        
        <div class="replay-controls">
            <button class="btn btn-secondary" id="prev-btn">
                <span>← Previous Move</span>
            </button>
            <button class="btn btn-primary" id="next-btn">
                <span>Next Move →</span>
            </button>
        </div>

        <div class="board-container">
            <div class="ultimate-board" id="board"></div>
        </div>
        
        <div class="replay-info">
            <div class="move-info" id="move-info">
                <span>Use the controls above to navigate through the game</span>
            </div>
        </div>
        
        <div class="back-link">
                <a href="/profile/{{.user_id}}" class="btn btn-outline">
                <span>Back to Profile</span>
            </a>
        </div>
    </div>
    
    <!-- Hidden CSRF token field -->
    <div style="display: none;" id="csrf-debug">
        {{ .csrfField }}
    </div>
    
    <div class="error-message hidden" id="error-message"></div>
    
    <script src="/js/replay.js"></script>
</body>
</html>
