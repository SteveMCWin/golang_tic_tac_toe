<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Tic-Tac-Toe</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/board.css">
</head>
<body>
    <div class="waiting-message" id="waiting-message">
        <div class="waiting-content">
            <div class="waiting-spinner"></div>
            <h2>Waiting for opponent...</h2>
            <p>Game will start once another player joins</p>
        </div>
    </div>
    
    <div class="game-container hidden" id="game-container">
        <div class="game-header">
            <div class="player-info" id="player1-info">
                <div class="player-details">
                    <div class="player-name">Player 1</div>
                    <div class="player-symbol">X</div>
                </div>
                <div class="player-timer" id="p1-timer">--:--</div>
            </div>
            
            <div class="current-turn" id="current-turn">
                Waiting...
            </div>
            
            <div class="player-info" id="player2-info">
                <div class="player-details">
                    <div class="player-name">Player 2</div>
                    <div class="player-symbol">O</div>
                </div>
                <div class="player-timer" id="p2-timer">--:--</div>
            </div>
        </div>

        <div class="board-container">
            <div class="ultimate-board" id="board"></div>
        </div>
    </div>
    
    <!-- Game Over Overlay -->
    <div class="game-over-overlay hidden" id="game-over-overlay">
        <div class="game-over-modal">
            <div class="game-over-content">
                <h2 class="game-over-title" id="game-over-title"></h2>
                <div class="game-over-buttons">
                    <a href="/" class="btn btn-secondary">
                        <span>Home</span>
                    </a>
                    <a href="/hub" class="btn btn-primary">
                        <span>Play Again</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        window.appConfig = {
            gameMode: {{ .game_mode }}
        };
    </script>
    <script src="/js/board.js"></script>
</body>
</html>
