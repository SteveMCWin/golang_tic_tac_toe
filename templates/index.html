<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Tic-Tac-Toe</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Welcome</h1>

        <div class="button-grid">
            <a href="/hub" class="btn btn-primary">
                <span>Start Playing</span>
            </a>

            {{if eq .user_id 0}}
            <div class="divider"></div>

            <a href="/auth/google" class="btn btn-secondary">
                <span>Sign in with Google</span>
            </a>

            <a href="/auth/github" class="btn btn-secondary">
                <span>Sign in with GitHub</span>
            </a>
            {{end}}

            {{if ne .user_id 0}}
            <a href="/profile/{{.user_id}}" class="btn btn-secondary">
                <span>View Profile</span>
            </a>
            {{end}}

            <div class="divider"></div>

            <a href="/leaderboard" class="btn btn-secondary">
                <span>Leaderboard</span>
            </a>

            <a href="/search" class="btn btn-secondary">
                <span>Search for users</span>
            </a>

            <a href="/about" class="btn btn-outline">
                <span>About</span>
            </a>
        </div>
    </div>
</body>
</html>
