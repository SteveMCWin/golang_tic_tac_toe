name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23.1'

    - name: Install SQLite and build spellfix extension
      run: |
        sudo apt-get update
        sudo apt-get install -y sqlite3 libsqlite3-dev build-essential curl
        curl -L https://raw.githubusercontent.com/sqlite/sqlite/version-3.46.0/ext/misc/spellfix.c -o spellfix.c
        gcc -shared -fPIC -I/usr/include -o extensions/spellfix.so spellfix.c -lsqlite3
        rm spellfix.c

    - name: Setup test database
      run: |
        cd data
        touch database.db
        sqlite3 database.db < create_user_table.sql
        sqlite3 database.db < create_game_table.sql
        sqlite3 database.db < create_sessions_table.sql
        sqlite3 database.db < create_spellfix_user_table.sql
        cd ..

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
